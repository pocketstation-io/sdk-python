[package]
name = "pocketstation-python"
version = "0.1.3"
edition = "2021"
publish = false
description = "Native PocketStation runtime bindings for the Python SDK"
license = "MIT"
repository = "https://github.com/pocketstation-io/sdk-python"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = []
conformance-fixtures = ["pocketstation/conformance-fixtures"]

[dependencies]
pocketstation = "=1.1.6"
pocketstation-relay = "=0.1.3"
pyo3 = { version = "0.27", features = ["abi3-py311"] }

[dev-dependencies]
pocketstation = { version = "=1.1.6", features = ["conformance-fixtures"] }
tempfile = "3"
