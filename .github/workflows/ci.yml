name: python-sdk-ci

on:
  pull_request:
  push:
    branches: [main, candidate/python-0.1.5-oss-108]

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - name: Check out Python SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: sdk-python

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt, llvm-tools

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libpipewire-0.3-dev clang pkg-config

      - name: Install SDK and development gates
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.13.0" "pytest>=8.0" "pytest-asyncio>=0.23" "mypy==2.3.1" "ruff>=0.11" "packaging==26.3" "websockets>=17.0,<18"
          maturin build --release --locked --features conformance-fixtures --out dist-conformance
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist-conformance').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Rust formatting
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        working-directory: sdk-python
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - name: Native conformance
        working-directory: sdk-python
        run: cargo test --manifest-path native/Cargo.toml --features conformance-fixtures --locked

      - name: Native lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        working-directory: sdk-python
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --features conformance-fixtures --locked -- -D warnings

      - name: Python lint and formatting
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        working-directory: sdk-python
        run: |
          ruff check python tests examples
          ruff format --check python tests examples

      - name: Public documentation language
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        working-directory: sdk-python
        shell: bash
        run: |
          if rg -n -i '\b(boundary|path|surface|authority|projection|lowering|flow|layer|bounded|contracts?)\b' \
            README.md RELEASE_NOTES.md docs examples \
            --glob '*.md' --glob '*.mdx'; then
            echo "Public documentation must name the API, queue, limit, process, service, or request directly."
            exit 1
          fi

      - name: Python type contract
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        working-directory: sdk-python
        run: mypy python examples tests/qualification

      - name: Python tests
        working-directory: sdk-python
        run: python -m pytest

      - name: Build wheel
        working-directory: sdk-python
        env:
          CARGO_TARGET_DIR: native/target-release
        shell: bash
        run: |
          compatibility=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Source CI tests against the runner's installed libraries. Public
            # repaired manylinux wheels are built by qualify-distribution.yml.
            compatibility=(--compatibility linux)
          fi
          maturin build --release --locked "${compatibility[@]}" --out dist
          python build_backend.py dist/*.whl

      - name: Test isolated release wheel
        working-directory: sdk-python
        run: >-
          python tests/run_artifact_consumer.py
          --artifact-kind wheel
          --artifact-dir dist

      - name: Upload wheel for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocketstation-${{ matrix.os }}-py${{ matrix.python }}
          path: sdk-python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: source distribution / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Python SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: sdk-python

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: llvm-tools

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libpipewire-0.3-dev clang pkg-config

      - name: Build source distribution
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.13.0"
          maturin sdist --manifest-path native/Cargo.toml --out dist

      - name: Rebuild and test isolated source distribution
        working-directory: sdk-python
        run: >-
          python tests/run_artifact_consumer.py
          --artifact-kind sdist
          --artifact-dir dist

      - name: Upload source distribution for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocketstation-sdist
          path: sdk-python/dist/*.tar.gz
          if-no-files-found: error

  aec:
    name: opt-in AEC / macOS
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt, llvm-tools
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Build explicitly enabled artifact
        run: |
          python -m pip install "maturin==1.13.0" "meson==1.7.2" "ninja==1.11.1.4" pytest pytest-asyncio
          maturin build --release --locked --features aec --out dist-aec
          python build_backend.py dist-aec/*.whl
          python -m pip install dist-aec/*.whl
      - name: Verify enabled processing and native checks
        env:
          PKS_EXPECT_AEC: "1"
        run: |
          python tests/installed_consumer.py
          python -m pytest tests/test_aec.py tests/test_aio_aec.py
          cargo test --manifest-path native/Cargo.toml --all-features --locked
          cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features --locked -- -D warnings
