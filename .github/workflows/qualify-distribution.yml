name: qualify-python-distribution

'on':
  push:
    branches: [candidate/python-0.1.5-platform-107, candidate/python-0.1.5-oss-108]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

concurrency:
  group: qualify-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      test: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: matrix
        run: |
          echo "build=$(python3 tools/validate_wheel_matrix.py matrix --kind build)" >> "$GITHUB_OUTPUT"
          echo "test=$(python3 tools/validate_wheel_matrix.py matrix --kind test)" >> "$GITHUB_OUTPUT"

  wheels:
    needs: matrix
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.id }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build and repair the native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          maturin-version: v1.13.0
          rust-toolchain: 1.95.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: dnf install -y alsa-lib-devel openssl-devel opus-devel pipewire-devel clang cmake ninja-build
          args: --release --locked --compatibility pypi --out dist
      - name: Finalize dependency license metadata before qualification
        shell: bash
        run: python build_backend.py dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.id }}
          path: dist/*.whl
          if-no-files-found: error

  consumers:
    needs: [matrix, wheels]
    name: Consume ${{ matrix.id }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.test) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-${{ matrix.id }}
          path: dist
      - name: Execute the frozen wheel in an isolated environment
        run: >-
          python tools/validate_wheel_matrix.py consume
          --target ${{ matrix.id }} --artifact-dir dist
          --output reports/consumer-${{ matrix.id }}-${{ matrix.python }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consumer-${{ matrix.id }}-${{ matrix.python }}
          path: reports/
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - name: Install source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libpipewire-0.3-dev
          python -m pip install 'maturin==1.13.0'
      - name: Build and execute the standalone source distribution
        run: |
          maturin sdist --manifest-path native/Cargo.toml --out dist
          python tools/validate_wheel_matrix.py consume --target linux-x64 --format sdist --artifact-dir dist --output reports/consumer-sdist.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-distribution
          path: |
            dist/*.tar.gz
            reports/
          if-no-files-found: error

  verify:
    needs: [consumers, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: retained
      - name: Verify every declared cell and exact package bytes
        env:
          QUALIFIED_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 tools/validate_wheel_matrix.py verify --directory retained
          --source-commit "$QUALIFIED_SOURCE_SHA" --output retained/release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-distributions
          path: retained/
          if-no-files-found: error
