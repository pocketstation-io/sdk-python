name: release-python

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version-matched tag at the qualified source commit
        required: true
        type: string
      qualification_run_id:
        description: Successful qualify-python-distribution run for this exact tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
      - name: Check tag, successful qualification and exact artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$RELEASE_TAG" == "pocketstation-v${version}" ]]
          source_commit="$(git rev-parse HEAD)"
          [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$source_commit" ]]
          git fetch origin main
          git merge-base --is-ancestor "$source_commit" origin/main
          gh api "repos/pocketstation-io/sdk-python/actions/runs/$QUALIFICATION_RUN_ID" > run.json
          gh run download "$QUALIFICATION_RUN_ID" --repo pocketstation-io/sdk-python --name qualified-distributions --dir qualified
          python3 tools/prepare_release.py --qualified qualified --run-info run.json --source-commit "$source_commit" --tag "$RELEASE_TAG" --output dist --receipt prepared-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-inputs
          path: |
            dist/
            prepared-release.json
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pocketstation
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inputs
          path: incoming
      - name: Recheck the exact publication inputs
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('incoming/prepared-release.json').read_text())
          expected = {item['filename']: item['sha256'] for item in receipt['distributions']}
          actual = list(Path('incoming/dist').iterdir())
          if len(expected) != 7 or len(actual) != 7 or {p.name for p in actual} != set(expected):
              raise SystemExit('Unexpected publication files')
          if receipt['rebuilt_during_publication'] is not False:
              raise SystemExit('Publication inputs were rebuilt')
          for path in actual:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('Publication input is not a regular file')
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected[path.name]:
                  raise SystemExit('Publication input hash differs')
          print('PASS: exact seven qualified distribution hashes')
          PY
      - name: Publish the qualified bytes with PyPI attestations
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: incoming/dist/
          attestations: true
